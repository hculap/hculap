<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile README assets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Playfair+Display:ital,wght@1,500&family=Space+Grotesk:wght@500;600&display=block">
<style>
  /* Source for the images in ../ . Render with render.cjs; each element with an id becomes <id>.png at 2x. */
  body { margin: 0; padding: 40px; background: #777; display: flex; flex-direction: column; align-items: flex-start; gap: 40px; }
  .card { background: #0a0a0a; border: 2px solid #1f1f1f; border-radius: 14px; box-sizing: border-box; font-family: Inter, sans-serif; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: 0.12em; color: #10b981; }

  #banner { width: 1280px; height: 400px; padding: 52px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  #banner .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 23px; }
  #banner .url { font-family: 'Space Grotesk', sans-serif; font-weight: 500; letter-spacing: 0.08em; color: #9ca3af; }
  #banner h1 { margin: 0; font-weight: 800; font-size: 84px; line-height: 1.04; letter-spacing: -0.025em; color: #fff; }
  #banner .tag { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 46px; line-height: 1.1; color: #f59e0b; }

  #footer { width: 1280px; height: 300px; padding: 52px 72px; display: flex; align-items: center; justify-content: space-between; gap: 48px; }
  #footer .eyebrow { font-size: 23px; display: block; margin-bottom: 18px; }
  #footer h2 { margin: 0; font-weight: 700; font-size: 52px; line-height: 1.12; letter-spacing: -0.015em; color: #fff; }
  #footer .btn { flex: none; font-weight: 600; font-size: 28px; color: #0a0a0a; background: #10b981; padding: 18px 32px; border-radius: 8px; }

  .badges { display: flex; gap: 12px; }
  .badge { display: inline-flex; align-items: center; height: 28px; padding: 0 14px; font-family: Verdana, 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; }
  .emerald { background: #10b981; color: #0a0a0a; }
  .amber { background: #f59e0b; color: #0a0a0a; }
  .dark { background: #161616; color: #f5f5f5; box-shadow: inset 0 0 0 1px #2e2e2e; }
</style>
</head>
<body>
<div id="banner" class="card">
  <div class="top"><span class="eyebrow">// SZYMON PALUCH · AI CONSULTANT</span><span class="url">SZYMONPALUCH.COM</span></div>
  <h1>From <span style="color:#10b981">AI strategy</span><br>to production.</h1>
  <div class="tag">No consulting bullshit.</div>
</div>

<div id="footer" class="card">
  <div><span class="eyebrow">// NEXT STEP</span><h2>What is “we’re still testing it”<br><span style="color:#f59e0b">AI costing you?</span></h2></div>
  <span class="btn">Book a call →</span>
</div>

<div class="badges">
  <span id="btn-book-a-call" class="badge emerald">BOOK A CALL</span>
  <span id="btn-website" class="badge dark">WEBSITE</span>
  <span id="btn-newsletter" class="badge amber">NEWSLETTER</span>
  <span id="btn-linkedin" class="badge dark">LINKEDIN</span>
  <span id="btn-x" class="badge dark">X</span>
  <span id="btn-youtube" class="badge dark">YOUTUBE</span>
  <span id="btn-choose-your-exam" class="badge amber">CHOOSE YOUR EXAM</span>
</div>
</body>
</html>
