name: Latest blog posts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://szymonpaluch.com/rss.xml"
          max_post_count: 5
          date_format: "d mmm yyyy"
          template: "$newline- [$title]($url?utm_source=github&utm_medium=readme) · $date"
          commit_message: "docs: update latest blog posts"
